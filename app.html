<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#08b7c7" />
  <style>:root{--cyan:#07b7c7;--cyan2:#039aa9;--ink:#17252e;--muted:#71808a;--line:#e4eaec;--bg:#f5f7f8;--yellow:#f7c63d}*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink)}button{font:inherit}.app-frame{min-height:100vh;padding-bottom:80px}.app-header{background:linear-gradient(135deg,var(--cyan),#13c3d0);color:#fff;padding:26px 20px 22px;display:flex;align-items:center;justify-content:space-between}.app-header small{opacity:.85}.app-header h1{font-size:23px;margin:4px 0 0}.icon-button,.avatar{border:0;background:rgba(255,255,255,.16);color:#fff;border-radius:13px;width:42px;height:42px;font-size:21px}.avatar{font-weight:800;border-radius:50%;background:#fff;color:var(--cyan2)}.app-main{padding:16px;max-width:520px;margin:auto}.balance-card{background:linear-gradient(145deg,#153b45,#102a32);color:#fff;padding:22px;border-radius:22px;box-shadow:0 14px 34px rgba(12,63,71,.2)}.balance-top,.balance-meta,.section-row{display:flex;align-items:center;justify-content:space-between}.balance-top span,.balance-meta{color:#cbe4e7;font-size:13px}.balance-top button{border:0;background:transparent;color:#fff}.balance-value{font-size:36px;font-weight:800;margin:18px 0}.balance-value small{font-size:14px}.demo-pill{padding:5px 9px;background:rgba(255,255,255,.12);border-radius:999px}.quick-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}.quick-actions button,.services-grid button{border:1px solid var(--line);background:#fff;border-radius:17px;min-height:100px;padding:12px;color:var(--ink)}.quick-actions button span,.services-grid button span{display:block;color:var(--cyan2);font-size:29px;margin-bottom:10px}.quick-actions button b,.services-grid button b{font-size:13px}.new-feature{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;margin:18px 0;background:linear-gradient(135deg,#fff8dc,#fff);border:1px solid #f3dfa2;border-radius:18px;padding:14px}.new-icon{width:50px;height:50px;display:grid;place-items:center;background:var(--yellow);border-radius:15px;font-weight:900}.new-feature span{color:#a77700;font-size:12px;font-weight:800}.new-feature h2{font-size:15px;margin:3px 0}.new-feature p{font-size:12px;color:var(--muted);margin:0}.new-feature button{border:0;background:transparent;font-size:23px}.services-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.recent-section{background:#fff;border-radius:19px;padding:17px;margin-top:18px;border:1px solid var(--line)}.section-row h2{font-size:17px}.section-row button{border:0;background:transparent;color:var(--cyan2);font-weight:700}.transaction{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;border-top:1px solid var(--line);padding:14px 0}.transaction small{display:block;color:var(--muted);margin-top:4px}.transaction strong{font-size:13px}.tx-icon{width:39px;height:39px;border-radius:13px;background:#edf3f4;display:grid;place-items:center}.tx-icon.positive{background:#e5f8f0;color:#14845b}.positive-text{color:#14845b}.bottom-nav{position:fixed;bottom:0;inset-inline:0;height:72px;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);z-index:10}.bottom-nav button{border:0;background:#fff;color:#808b92;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}.bottom-nav button span{font-size:22px}.bottom-nav button b{font-size:11px}.bottom-nav button.active{color:var(--cyan2)}.toast{position:fixed;left:50%;bottom:88px;transform:translate(-50%,30px);background:#17252e;color:#fff;padding:12px 18px;border-radius:13px;opacity:0;pointer-events:none;transition:.25s;white-space:nowrap;z-index:20}.toast.show{opacity:1;transform:translate(-50%,0)}@media(min-width:700px){.app-frame{max-width:520px;margin:auto;background:var(--bg);box-shadow:0 0 40px rgba(0,0,0,.08)}.bottom-nav{max-width:520px;left:50%;right:auto;width:100%;transform:translateX(-50%)}}</style>
  <title>Bankily</title>
</head>
<body class="app-body">
  <div class="app-frame">
    <header class="app-header"><button class="icon-button" id="menuButton" aria-label="القائمة">☰</button><div><small>مرحبًا بك</small><h1>لوحة القيادة</h1></div><button class="avatar" aria-label="الحساب">A</button></header>
    <main class="app-main">
      <section class="balance-card"><div class="balance-top"><span>الرصيد المتاح</span><button id="toggleBalance" aria-label="إخفاء الرصيد">◉</button></div><div class="balance-value" id="balanceValue">25,840 <small>MRU</small></div><div class="balance-meta"><span>آخر تحديث: الآن</span><span class="demo-pill">تجريبي</span></div></section>
      <section class="quick-actions" aria-label="الخدمات الرئيسية"><button data-action="تحويل الأموال"><span>↔</span><b>تحويل الأموال</b></button><button data-action="تسديد المشتريات"><span>▣</span><b>تسديد المشتريات</b></button><button data-action="حسابي"><span>⌁</span><b>حسابي</b></button></section>
      <section class="new-feature" id="newFeature"><div class="new-icon">QR</div><div><span>جديد</span><h2>التحويل السريع عبر QR</h2><p>امسح الرمز وابدأ التحويل في ثوانٍ.</p></div><button data-action="فتح قارئ QR">←</button></section>
      <section class="services-grid"><button data-action="تعبئة رصيد الهاتف"><span>▱</span><b>تعبئة رصيد الهاتف</b></button><button data-action="تسديد الفواتير"><span>▤</span><b>تسديد الفواتير</b></button><button data-action="طلب دفتر شيكات"><span>▰</span><b>طلب دفتر شيكات</b></button><button data-action="البطاقات البنكية"><span>▭</span><b>البطاقات البنكية</b></button><button data-action="سحب النقود"><span>⇩</span><b>سحب النقود</b></button><button data-action="ب-باي"><span>▣</span><b>ب-باي</b></button></section>
      <section class="recent-section"><div class="section-row"><h2>آخر العمليات</h2><button>عرض الكل</button></div><div class="transaction"><span class="tx-icon positive">↓</span><div><b>تحويل مستلم</b><small>اليوم، 14:20</small></div><strong class="positive-text">+1,500 MRU</strong></div><div class="transaction"><span class="tx-icon">⌁</span><div><b>تعبئة رصيد</b><small>أمس، 19:05</small></div><strong>-200 MRU</strong></div></section>
    </main>
    <nav class="bottom-nav"><button class="active"><span>⌂</span><b>الرئيسية</b></button><button><span>☆</span><b>المفضلة</b></button><button><span>♢</span><b>الإشعارات</b></button><button><span>?</span><b>المساعدة</b></button></nav>
  </div>
  <div class="toast" id="toast" role="status"></div>
  <script>const toast=document.getElementById('toast');let hideTimer;function notify(message){if(!toast)return;toast.textContent=message+' — متاح في النسخة القادمة';toast.classList.add('show');clearTimeout(hideTimer);hideTimer=setTimeout(()=>toast.classList.remove('show'),2200)}document.querySelectorAll('[data-action]').forEach(button=>button.addEventListener('click',()=>notify(button.dataset.action)));const toggle=document.getElementById('toggleBalance');const balance=document.getElementById('balanceValue');let hidden=false;if(toggle&&balance){toggle.addEventListener('click',()=>{hidden=!hidden;balance.innerHTML=hidden?'•••••• <small>MRU</small>':'25,840 <small>MRU</small>';toggle.textContent=hidden?'◎':'◉'})}document.querySelectorAll('.bottom-nav button').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('.bottom-nav button').forEach(x=>x.classList.remove('active'));button.classList.add('active');if(!button.textContent.includes('الرئيسية'))notify(button.textContent.trim())}));</script>
</body>
</html>
