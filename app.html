<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#10b6c9">
<title>Bankily</title>
<style>
:root{--turquoise:#10b6c9;--turquoise-dark:#039fb2;--gold:#d1b42c;--ink:#151515;--muted:#7f7a8a;--line:#c9c9c9;--paper:#fff;--app:#f7f7f7}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#ececec;font-family:Tahoma,Arial,sans-serif;color:var(--ink)}
button,input,select{font:inherit}.app{width:100%;max-width:460px;min-height:100vh;margin:auto;background:var(--app);position:relative;overflow:hidden}
.home-screen{min-height:100vh;padding-bottom:104px;background:#f7f7f7}.dashboard-header{height:258px;background:var(--turquoise);color:#fff;padding:22px 18px 18px}.header-row{height:42px;display:grid;grid-template-columns:42px 1fr 42px;align-items:center}.menu-btn{grid-column:1;background:transparent;border:0;color:#f5f5f5;font-size:42px;line-height:1;padding:0;cursor:pointer}.dashboard-title{grid-column:2;text-align:center;font-size:27px;font-weight:400;line-height:1}.quick-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:31px;direction:rtl}.quick-action{border:0;background:transparent;color:#fff;padding:0;cursor:pointer}.quick-circle{width:88px;height:88px;border:1.7px solid var(--gold);border-radius:50%;margin:0 auto 13px;display:grid;place-items:center}.quick-circle svg{width:45px;height:45px;stroke:#f2f2f2;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.quick-label{font-size:17px;line-height:1.25;font-weight:400;white-space:nowrap}.service-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:20px 19px 0;direction:rtl}.service-card{height:214px;border:1px solid var(--line);background:var(--paper);display:flex;flex-direction:column;justify-content:center;align-items:center;padding:16px 8px;cursor:pointer}.service-icon{height:74px;display:grid;place-items:center;margin-bottom:20px}.service-icon svg{width:62px;height:62px;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.service-icon.teal svg{stroke:var(--turquoise)}.service-icon.gold svg{stroke:#f0bc0b}.service-label{font-size:18px;line-height:1.5;text-align:center;font-weight:400}.single-third{grid-column:1}.bottom-nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:460px;height:93px;background:#fafafa;border-top:1px solid #e1e1e1;display:grid;grid-template-columns:repeat(4,1fr);z-index:20;direction:rtl}.nav-btn{border:0;background:transparent;color:#777383;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;padding:5px 2px;cursor:pointer}.nav-btn svg{width:37px;height:37px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.nav-btn span{font-size:14px}.nav-btn.active{color:var(--turquoise)}
.screen{display:none;min-height:100vh;padding-bottom:28px;background:#f4f4f4}.screen.active{display:block}.screen-head{height:74px;background:var(--turquoise);color:#fff;display:grid;grid-template-columns:52px 1fr 52px;align-items:center;padding:0 10px;position:sticky;top:0;z-index:10}.back-btn{border:0;background:transparent;color:#fff;font-size:35px;cursor:pointer;transform:scaleX(-1)}.screen-title{text-align:center;font-size:21px;font-weight:400}.screen-body{padding:18px}.panel{background:#fff;border:1px solid #ddd;border-radius:7px;padding:18px;margin-bottom:14px}.panel h3{font-size:18px;margin:0 0 14px;font-weight:500}.field{margin-bottom:14px}.field label{display:block;font-size:14px;margin-bottom:7px;color:#4f4f4f}.field input,.field select{width:100%;height:48px;border:1px solid #cfcfcf;border-radius:6px;background:#fff;padding:0 12px;outline:none}.field input:focus,.field select:focus{border-color:var(--turquoise)}.primary{width:100%;height:50px;border:0;border-radius:6px;background:var(--turquoise);color:#fff;font-weight:700;cursor:pointer}.secondary{width:100%;height:48px;border:1px solid var(--turquoise);border-radius:6px;background:#fff;color:var(--turquoise-dark);font-weight:700;cursor:pointer}.list-item{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #ececec;padding:14px 0}.list-item:last-child{border-bottom:0}.chip{padding:5px 9px;border-radius:999px;background:#e8f8fa;color:#04899b;font-size:12px}.empty{color:#777;text-align:center;padding:24px 10px}.side-menu{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.32);display:none}.side-menu.open{display:block}.drawer{width:82%;max-width:330px;height:100%;background:#fff;margin-right:0;margin-left:auto;padding:28px 20px;box-shadow:-12px 0 35px rgba(0,0,0,.2)}.drawer h2{margin:0 0 25px;color:var(--turquoise-dark)}.drawer button{width:100%;text-align:right;border:0;background:#fff;border-bottom:1px solid #eee;padding:15px 4px;font-size:16px}.toast{position:fixed;left:50%;bottom:112px;transform:translate(-50%,25px);background:#222;color:#fff;padding:12px 18px;border-radius:8px;opacity:0;pointer-events:none;transition:.22s;z-index:60;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:380px){.dashboard-header{height:244px}.quick-circle{width:78px;height:78px}.quick-label{font-size:15px}.service-grid{padding-inline:12px}.service-card{height:190px}.service-label{font-size:16px}.service-icon svg{width:54px;height:54px}}
@media(min-width:700px){body{background:#d9eef1}.app{box-shadow:0 0 35px rgba(0,0,0,.14)}}
</style>
</head>
<body>
<div class="app">
  <section id="home" class="home-screen">
    <header class="dashboard-header">
      <div class="header-row"><button class="menu-btn" id="openMenu" aria-label="القائمة">☰</button><div class="dashboard-title">لوحة القيادة</div></div>
      <div class="quick-actions">
        <button class="quick-action" data-page="purchase"><div class="quick-circle"><svg viewBox="0 0 64 64"><rect x="12" y="9" width="25" height="42" rx="2"/><path d="M18 16h13M18 22h13M18 28h13M20 42h8"/><path d="M38 25l6-6 7 7 5-5v24H39z"/><path d="M42 34h10M42 39h8"/></svg></div><div class="quick-label">تسديد مشتريات</div></button>
        <button class="quick-action" data-page="transfer"><div class="quick-circle"><svg viewBox="0 0 64 64"><rect x="10" y="12" width="36" height="25" rx="2"/><rect x="15" y="17" width="36" height="25" rx="2"/><path d="M20 22h26v15H20z"/><circle cx="33" cy="29.5" r="4"/><path d="M9 48h27M15 43l-6 5 6 5M55 48H38M49 43l6 5-6 5"/></svg></div><div class="quick-label">تحويل الأموال</div></button>
        <button class="quick-action" data-page="account"><div class="quick-circle"><svg viewBox="0 0 64 64"><rect x="13" y="9" width="24" height="44" rx="2"/><path d="M19 16h12M19 21h12M19 26h12M19 31h8M19 38h12M19 43h12"/><path d="M37 16h11v35H37M42 11h9v40"/></svg></div><div class="quick-label">حسابي</div></button>
      </div>
    </header>

    <main class="service-grid">
      <button class="service-card" data-page="recharge"><div class="service-icon teal"><svg viewBox="0 0 64 64"><rect x="19" y="5" width="28" height="52" rx="3"/><path d="M27 10h12M29 52h8"/><path d="M25 36l8-9 8 9M33 27v18"/></svg></div><div class="service-label">تعبئة رصيد الهاتف</div></button>
      <button class="service-card" data-page="bills"><div class="service-icon gold"><svg viewBox="0 0 64 64"><path d="M18 7h25v46l-5-3-5 3-5-3-5 3-5-3z"/><path d="M24 16h13M24 22h13M24 28h13M24 34h10"/><path d="M13 31c-3 2-5 6-5 10v12M49 28c4 2 7 6 7 12v13"/></svg></div><div class="service-label">تسديد الفواتير</div></button>
      <button class="service-card" data-page="checks"><div class="service-icon teal"><svg viewBox="0 0 64 64"><path d="M12 15h38v31H12z"/><path d="M17 21h27M17 27h18M17 36h9M31 36h13"/><path d="M8 19h4v31h38v-4M16 11h38v31h-4"/></svg></div><div class="service-label">طلب دفتر شيكات</div></button>
      <button class="service-card" data-page="cards"><div class="service-icon gold"><svg viewBox="0 0 64 64"><rect x="8" y="15" width="48" height="34" rx="4"/><path d="M8 24h48M14 40h13"/><rect x="41" y="30" width="8" height="7" rx="1"/></svg></div><div class="service-label">البطاقات البنكية</div></button>
      <button class="service-card" data-page="cash"><div class="service-icon teal"><svg viewBox="0 0 64 64"><path d="M12 13h40v10H12zM17 23h30v30H17z"/><path d="M32 28v17M26 39l6 6 6-6"/><path d="M12 18H6v-6h52v6h-6"/></svg></div><div class="service-label">سحب النقود</div></button>
      <button class="service-card" data-page="bpay"><div class="service-icon gold"><svg viewBox="0 0 64 64"><rect x="18" y="7" width="28" height="50" rx="3"/><path d="M25 12h14M28 51h8"/><path d="M23 27h18v15H23zM26 31h12M27 36h10"/></svg></div><div class="service-label">ب-باي</div></button>
      <button class="service-card single-third" data-page="gimtel"><div class="service-icon teal"><svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="25" fill="#10b6c9" stroke="none"/><path d="M42 22c-3-3-6-4-10-4-8 0-14 6-14 14s6 14 14 14c4 0 8-1 11-4V31H31v7h5v2c-1 1-3 1-4 1-5 0-8-4-8-9s3-9 8-9c2 0 4 1 6 3z" stroke="#fff" fill="none" stroke-width="4"/></svg></div><div class="service-label">جميتل</div></button>
    </main>

    <nav class="bottom-nav">
      <button class="nav-btn active" data-nav="home"><svg viewBox="0 0 48 48"><path d="M8 23 24 8l16 15v18H29V29H19v12H8z"/></svg><span>الرئيسية</span></button>
      <button class="nav-btn" data-page="favorites"><svg viewBox="0 0 48 48"><path d="m24 6 5.5 11 12.5 1.8-9 8.8 2.1 12.4L24 34l-11.1 6 2.1-12.4-9-8.8L18.5 17z"/></svg><span>المفضلة</span></button>
      <button class="nav-btn" data-page="notifications"><svg viewBox="0 0 48 48"><path d="M13 34h22l-3-4V20c0-6-3-10-8-10s-8 4-8 10v10zM20 38c1 3 7 3 8 0"/></svg><span>الإشعارات</span></button>
      <button class="nav-btn" data-page="help"><svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="17"/><path d="M19 19c1-4 9-5 10 0 1 4-5 5-5 9M24 34h.01"/></svg><span>المساعدة</span></button>
    </nav>
  </section>

  <section id="serviceScreen" class="screen"><header class="screen-head"><button class="back-btn" id="backBtn">➜</button><div class="screen-title" id="screenTitle"></div></header><div class="screen-body" id="screenBody"></div></section>
</div>

<div class="side-menu" id="sideMenu"><aside class="drawer"><h2>Bankily</h2><button data-page="account">حسابي</button><button data-page="transfer">تحويل الأموال</button><button data-page="notifications">الإشعارات</button><button data-page="help">المساعدة</button><button id="closeMenu">إغلاق القائمة</button></aside></div>
<div class="toast" id="toast"></div>
<script>
const home=document.getElementById('home'),screen=document.getElementById('serviceScreen'),screenTitle=document.getElementById('screenTitle'),screenBody=document.getElementById('screenBody'),toast=document.getElementById('toast');
const pageNames={purchase:'تسديد مشتريات',transfer:'تحويل الأموال',account:'حسابي',recharge:'تعبئة رصيد الهاتف',bills:'تسديد الفواتير',checks:'طلب دفتر شيكات',cards:'البطاقات البنكية',cash:'سحب النقود',bpay:'ب-باي',gimtel:'جميتل',favorites:'المفضلة',notifications:'الإشعارات',help:'المساعدة'};
function field(label,type='text',placeholder=''){return `<div class="field"><label>${label}</label><input type="${type}" placeholder="${placeholder}"></div>`}
function select(label,opts){return `<div class="field"><label>${label}</label><select>${opts.map(x=>`<option>${x}</option>`).join('')}</select></div>`}
function form(title,fields,button='متابعة'){return `<div class="panel"><h3>${title}</h3>${fields}<button class="primary action-btn">${button}</button></div>`}
function renderPage(key){
 const templates={
 transfer:form('تحويل جديد',field('رقم المستفيد','tel','مثال: 22 00 00 00')+field('المبلغ','number','0 MRU')+field('البيان','text','اختياري'),'إرسال التحويل'),
 purchase:form('تسديد مشتريات',field('رقم التاجر','text','رقم التاجر')+field('المبلغ','number','0 MRU')+field('المرجع','text','اختياري'),'تأكيد الدفع'),
 account:`<div class="panel"><h3>معلومات الحساب</h3><div class="list-item"><span>الاسم</span><b>مستخدم Bankily</b></div><div class="list-item"><span>رقم الهاتف</span><b>—</b></div><div class="list-item"><span>الرصيد</span><b>0 MRU</b></div></div><button class="secondary action-btn">تعديل المعلومات</button>`,
 recharge:form('تعبئة رصيد الهاتف',select('المشغل',['Mauritel','Mattel','Chinguitel'])+field('رقم الهاتف','tel','رقم الهاتف')+field('المبلغ','number','0 MRU'),'تعبئة الرصيد'),
 bills:form('تسديد الفواتير',select('نوع الفاتورة',['الكهرباء','الماء','الإنترنت','الهاتف'])+field('رقم الاشتراك','text','رقم الاشتراك')+field('المبلغ','number','0 MRU'),'تسديد الفاتورة'),
 checks:form('طلب دفتر شيكات',select('نوع الدفتر',['25 ورقة','50 ورقة'])+field('الفرع','text','اختر الفرع'),'إرسال الطلب'),
 cards:`<div class="panel"><h3>بطاقاتي</h3><div class="empty">لا توجد بطاقات مضافة بعد.</div></div><button class="primary action-btn">طلب بطاقة بنكية</button>`,
 cash:form('سحب النقود',field('المبلغ','number','0 MRU')+field('رمز الوكيل','text','اختياري'),'إنشاء رمز السحب'),
 bpay:form('ب-باي',field('رقم الخدمة','text','رقم الخدمة')+field('المبلغ','number','0 MRU'),'الدفع'),
 gimtel:`<div class="panel"><h3>خدمات جميتل</h3><div class="list-item"><span>الخدمة</span><span class="chip">متاحة قريبًا</span></div></div>`,
 favorites:`<div class="panel"><h3>المفضلة</h3><div class="empty">لم تضف أي خدمة إلى المفضلة بعد.</div></div>`,
 notifications:`<div class="panel"><h3>الإشعارات</h3><div class="list-item"><div><b>مرحبًا بك في Bankily</b><div style="color:#777;margin-top:5px;font-size:13px">تم تجهيز النسخة الأولية من التطبيق.</div></div><span class="chip">جديد</span></div></div>`,
 help:`<div class="panel"><h3>المساعدة</h3><div class="list-item"><span>الأسئلة الشائعة</span><b>‹</b></div><div class="list-item"><span>الاتصال بالدعم</span><b>‹</b></div><div class="list-item"><span>عن التطبيق</span><b>‹</b></div></div>`
 };
 return templates[key]||`<div class="panel"><div class="empty">هذه الخدمة قيد التجهيز.</div></div>`;
}
function openPage(key){screenTitle.textContent=pageNames[key]||'Bankily';screenBody.innerHTML=renderPage(key);home.style.display='none';screen.classList.add('active');document.getElementById('sideMenu').classList.remove('open');window.scrollTo(0,0);screenBody.querySelectorAll('.action-btn').forEach(b=>b.addEventListener('click',()=>showToast('تم حفظ الطلب تجريبيًا')))}
function goHome(){screen.classList.remove('active');home.style.display='block';window.scrollTo(0,0)}
function showToast(msg){toast.textContent=msg;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1900)}
document.querySelectorAll('[data-page]').forEach(el=>el.addEventListener('click',()=>openPage(el.dataset.page)));document.getElementById('backBtn').addEventListener('click',goHome);document.getElementById('openMenu').addEventListener('click',()=>document.getElementById('sideMenu').classList.add('open'));document.getElementById('closeMenu').addEventListener('click',()=>document.getElementById('sideMenu').classList.remove('open'));document.getElementById('sideMenu').addEventListener('click',e=>{if(e.target.id==='sideMenu')e.currentTarget.classList.remove('open')});window.addEventListener('popstate',goHome);
</script>
</body>
</html>
