name: Build and publish Bankily APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'app.html'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Prepare embedded interface
        run: |
          mkdir -p android/app/src/main/assets
          cp app.html android/app/src/main/assets/index.html
      - name: Install Android SDK
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build installable APK
        run: gradle -p android assembleDebug --no-daemon
      - name: Publish APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Bankily.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Bankily.apk
          git commit -m "build: publish installable Bankily APK" || exit 0
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: Bankily-APK
          path: Bankily.apk
